name: Coverage refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Monthly

jobs:
  coverage-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Produce coverage report with Cloverage
        run: nix develop --command clj -M:dev:cloverage --no-html
      - name: Process coverage report
        uses: clearlyip/code-coverage-report-action@v7
        with:
          filename: target/coverage/cobertura.xml
          artifact_download_workflow_names: 'Branch build,Coverage refresh'
